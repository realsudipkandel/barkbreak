<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Break room — Bark Break</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <main class="app" data-testid="break-app">
      <section id="care-phase" class="panel active" data-testid="care-phase">
        <h1>Quick care</h1>
        <p class="lead" id="care-prompt">One short kindness, then I hold the gate.</p>
        <div class="dog-scene coat-golden" id="break-dog-scene" style="height: 180px"></div>
        <div class="grid-2">
          <button type="button" class="btn secondary" id="care-water" data-testid="break-water">Refill water</button>
          <button type="button" class="btn secondary" id="care-pet" data-testid="break-pet">Head scratch</button>
          <button type="button" class="btn secondary" id="care-play" data-testid="break-play">Toss ball</button>
          <button type="button" class="btn secondary" id="care-feed" data-testid="break-feed">Place snack</button>
        </div>
        <p class="muted" id="care-status" role="status"></p>
      </section>

      <section id="away-phase" class="panel" data-testid="away-phase">
        <h1>Away time</h1>
        <p class="lead" id="away-prompt"></p>
        <div class="timer" id="break-timer" data-testid="break-timer">03:00</div>
        <div class="row" style="justify-content: center">
          <button type="button" class="btn secondary" id="back-early" data-testid="back-early">I'm back early</button>
          <button type="button" class="btn" id="end-break" data-testid="end-break">End break</button>
        </div>
      </section>

      <section id="return-phase" class="panel" data-testid="return-phase">
        <h1>Welcome back</h1>
        <p class="lead" id="return-line">I absolutely did not lick the refresh button.</p>
        <div class="card" id="reward-summary" data-testid="reward-summary"></div>
        <p>How refreshed?</p>
        <div class="row">
          <button type="button" class="chip" data-feeling="more" data-testid="feel-more">More refreshed</button>
          <button type="button" class="chip" data-feeling="same" data-testid="feel-same">Same</button>
          <button type="button" class="chip" data-feeling="less" data-testid="feel-less">Less refreshed</button>
        </div>
        <button type="button" class="btn" id="close-break" style="margin-top: 12px" data-testid="close-break">Close</button>
      </section>
    </main>
    <script src="shared.js"></script>
    <script src="break.js"></script>
  </body>
</html>
